name: RTT Platform CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: real_rtt1_test
          MYSQL_USER: rtt_user
          MYSQL_PASSWORD: rtt_test_password
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, redis, gd, mbstring, xml, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Copy environment file
        run: cp .env.testing .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run database migrations
        run: php artisan migrate --seed --env=testing
        env:
          DB_DATABASE: real_rtt1_test
          DB_USERNAME: rtt_user
          DB_PASSWORD: rtt_test_password

      - name: Run PHP tests
        # Run Pest directly so the memory limit applies (artisan test re-spawns PHP with
        # the 128M default, which the Excel export tests exceed).
        run: php -d memory_limit=2G vendor/bin/pest --compact
        env:
          DB_DATABASE: real_rtt1_test
          DB_USERNAME: rtt_user
          DB_PASSWORD: rtt_test_password

      - name: Build frontend
        run: npm run build

      - name: Verify build output exists
        run: test -d public/build
